<!DOCTYPE html>
<html>
<head>
    <title>Borrow Book</title>
</head>
<body>
    <h1>Borrow "{{ book['title'] }}"</h1>
    <p>by {{ book['author'] }}</p>

    <form method="POST">

        <button type="submit">Confirm Borrow</button>
    </form>

    <br>
    <a href="/books">Cancel</a>
</body>
</html>
